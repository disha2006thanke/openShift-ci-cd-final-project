apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: cleanup
spec:
  workspaces:
    - name: source
  steps:
    - name: cleanup
      image: alpine:3.18
      script: |
        #!/bin/sh
        echo "Cleaning workspace..."
        find $(workspaces.source.path) -type d -name "__pycache__" -exec rm -rf {} +
        find $(workspaces.source.path) -type f -name "*.pyc" -delete
        echo "Cleanup completed."

---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: nose-test
spec:
  workspaces:
    - name: source
  steps:
    - name: run-nose-tests
      image: python:3.11
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/bash
        set -e
        echo "Installing test dependencies..."
        pip install --no-cache-dir nose
        echo "Running unit tests with nose..."
        nosetests
        echo "Nose tests completed successfully."
